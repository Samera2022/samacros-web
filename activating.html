<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saMacros Snapshot Activation Center</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #111827;
            --accent-1: #667eea;
            --accent-2: #764ba2;
            --ink: #e5e7eb;
            --muted: #94a3b8;
            --card: rgba(17, 24, 39, 0.78);
            --border: rgba(148, 163, 184, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 800px at 10% 10%, rgba(102, 126, 234, 0.1), transparent 60%),
                        radial-gradient(1000px 600px at 90% 15%, rgba(118, 75, 162, 0.12), transparent 55%),
                        linear-gradient(160deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--ink);
        }

        .container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            color: var(--ink);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
        }


        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: var(--ink);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: rgba(148, 163, 184, 0.1);
            color: var(--ink);
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-1);
            background: rgba(102, 126, 234, 0.15);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23e5e7eb' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        /* 下拉选项样式 */
        select option {
            background: var(--bg-2);
            color: var(--ink);
            padding: 8px 12px;
        }

        select option:checked {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
        }

        /* 自定义下拉菜单 */
        .custom-select {
            position: relative;
            display: block;
        }

        .custom-select select {
            display: none;
        }

        .select-button {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: rgba(148, 163, 184, 0.1);
            color: var(--ink);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            text-align: left;
        }

        .select-button:focus {
            outline: none;
            border-color: var(--accent-1);
            background: rgba(102, 126, 234, 0.15);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            margin-top: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .select-dropdown.open {
            max-height: 200px;
            overflow-y: auto;
        }

        /* 下拉菜单滚动条 */
        .select-dropdown::-webkit-scrollbar {
            width: 6px;
        }

        .select-dropdown::-webkit-scrollbar-track {
            background: transparent;
        }

        .select-dropdown::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 3px;
        }

        .select-dropdown::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }

        .select-option {
            padding: 8px 12px;
            cursor: pointer;
            color: var(--ink);
            transition: all 0.2s;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            font-size: 13px;
        }

        .select-option:last-child {
            border-bottom: none;
        }

        .select-option:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .select-option.selected {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            color: var(--accent-1);
            font-weight: 600;
        }

        .select-option:hover.selected {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4));
        }

        .hint {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-area {
            margin-top: 32px;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-area.show {
            display: block;
        }

        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(72, 187, 120, 0.3);
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 120px;
            background: rgba(72, 187, 120, 0.1);
            color: #86efac;
        }

        .copy-btn {
            margin-top: 12px;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }

        .copy-btn:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.4);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            animation: fadeIn 0.3s ease-out;
        }

        .alert-error {
            background: rgba(245, 85, 85, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(245, 85, 85, 0.3);
        }

        .alert-success {
            background: rgba(72, 187, 120, 0.1);
            color: #86efac;
            border: 1px solid rgba(72, 187, 120, 0.3);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 saMacros Activation Center</h1>
            <p class="subtitle">2026 Edition - Secure Offline Activation</p>
        </header>

        <form id="activationForm">
            <div class="input-group">
                <label for="platform">Purchase Platform</label>
                <div class="custom-select" id="platformSelect">
                    <button type="button" class="select-button">-- 选择购买平台 --</button>
                    <select id="platform" name="platform" required>
                        <option value="">-- 选择购买平台 --</option>
                        <option value="paypal">PayPal (Global)</option>
                        <option value="other">其他平台</option>
                    </select>
                    <div class="select-dropdown">
                        <div class="select-option" data-value="">-- 选择购买平台 --</div>
                        <div class="select-option" data-value="paypal">PayPal (Global)</div>
                        <div class="select-option" data-value="other">其他平台</div>
                    </div>
                </div>
                <p class="hint">选择您支付时使用的平台</p>
            </div>

            <div class="input-group">
                <label for="machineCode">Machine Code (HWID)</label>
                <input 
                    type="text" 
                    id="machineCode" 
                    name="machineCode" 
                    placeholder="例如: SAM-A1B2C3D4E5F6"
                    required
                    autocomplete="off"
                />
                <p class="hint">从 saMacros 客户端复制您的机器码</p>
            </div>

            <!-- PayPal 专用字段 -->
            <div class="input-group" id="paypalGroup" style="display: none;">
                <label for="paypalOrderId">PayPal Order ID</label>
                <input 
                    type="text" 
                    id="paypalOrderId" 
                    name="paypalOrderId" 
                    placeholder="例如: 5O190127TN364715T"
                    autocomplete="off"
                />
                <p class="hint">请输入 PayPal 订单号（用于后台核验金额）</p>
            </div>

            <!-- 其他平台专用字段 -->
            <div class="input-group" id="otherGroup" style="display: none;">
                <label for="otherOrderId">Payment Order ID</label>
                <input 
                    type="text" 
                    id="otherOrderId" 
                    name="otherOrderId" 
                    placeholder="例如: ORD-20260218-ABCD1234"
                    autocomplete="off"
                />
                <p class="hint">请输入您从发卡平台收到的订单号</p>
            </div>

            <button type="submit" id="submitBtn">
                Generate Activation Key
            </button>
        </form>

        <div id="alertBox"></div>

        <div class="result-area" id="resultArea">
            <label>Your Activation Key:</label>
            <textarea id="activationKey" readonly></textarea>
            <button class="copy-btn" id="copyBtn">📋 Copy to Clipboard</button>
        </div>
    </div>

    <script>
        // 自定义下拉菜单处理
        function initCustomSelect() {
            const customSelects = document.querySelectorAll('.custom-select');
            
            customSelects.forEach(customSelect => {
                const button = customSelect.querySelector('.select-button');
                const dropdown = customSelect.querySelector('.select-dropdown');
                const options = customSelect.querySelectorAll('.select-option');
                const nativeSelect = customSelect.querySelector('select');
                
                // 初始化按钮：添加箭头
                function updateButtonDisplay(text) {
                    button.textContent = text;
                    button.style.display = 'flex';
                    button.style.justifyContent = 'space-between';
                    button.style.alignItems = 'center';
                    const arrowSpan = document.createElement('span');
                    arrowSpan.textContent = '▼';
                    arrowSpan.style.marginLeft = 'auto';
                    arrowSpan.style.fontSize = '12px';
                    arrowSpan.style.color = 'var(--muted)';
                    arrowSpan.style.flexShrink = '0';
                    button.appendChild(arrowSpan);
                }
                
                // 初始化
                updateButtonDisplay(button.textContent);
                
                // 打开/关闭下拉菜单
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    dropdown.classList.toggle('open');
                });
                
                // 选择选项
                options.forEach(option => {
                    option.addEventListener('click', (e) => {
                        e.preventDefault();
                        const value = option.dataset.value;
                        const text = option.textContent;
                        
                        // 清空按钮并重新更新显示
                        button.innerHTML = '';
                        updateButtonDisplay(text);
                        
                        // 更新选中状态
                        options.forEach(opt => opt.classList.remove('selected'));
                        option.classList.add('selected');
                        
                        // 更新原生 select
                        nativeSelect.value = value;
                        
                        // 关闭下拉菜单
                        dropdown.classList.remove('open');
                        
                        // 触发 change 事件
                        nativeSelect.dispatchEvent(new Event('change'));
                    });
                });
                
                // 点击外部关闭
                document.addEventListener('click', (e) => {
                    if (!customSelect.contains(e.target)) {
                        dropdown.classList.remove('open');
                    }
                });
            });
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', initCustomSelect);

        const form = document.getElementById('activationForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        const resultArea = document.getElementById('resultArea');
        const activationKeyInput = document.getElementById('activationKey');
        const copyBtn = document.getElementById('copyBtn');
        const machineCodeInput = document.getElementById('machineCode');
        const paypalOrderIdInput = document.getElementById('paypalOrderId');
        const otherOrderIdInput = document.getElementById('otherOrderId');
        const platformSelect = document.getElementById('platform');
        const paypalGroup = document.getElementById('paypalGroup');
        const otherGroup = document.getElementById('otherGroup');

        // 平台切换逻辑
        platformSelect.addEventListener('change', function() {
            const platform = this.value;
            
            // 隐藏所有平台特定字段
            paypalGroup.style.display = 'none';
            otherGroup.style.display = 'none';
            paypalOrderIdInput.required = false;
            otherOrderIdInput.required = false;
            
            // 根据选择显示对应字段
            if (platform === 'paypal') {
                paypalGroup.style.display = 'block';
                paypalOrderIdInput.required = true;
            } else if (platform === 'other') {
                otherGroup.style.display = 'block';
                otherOrderIdInput.required = true;
            }
        });

        // URL 参数检测 - 自动选择 PayPal 并填充订单号
        const queryParams = new URLSearchParams(window.location.search);
        const paypalOrderIdParam = queryParams.get('paypal_order_id');
        if (paypalOrderIdParam) {
            platformSelect.value = 'paypal';
            platformSelect.dispatchEvent(new Event('change'));
            paypalOrderIdInput.value = paypalOrderIdParam;
        }

        // 显示提示信息
        function showAlert(message, type = 'error') {
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertBox.innerHTML = '';
            }, 5000);
        }

        // 客户端验证
        function validateInputs() {
            const machineCode = machineCodeInput.value.trim();
            const platform = platformSelect.value;

            if (!platform) {
                showAlert('请选择购买平台');
                return false;
            }

            if (!machineCode) {
                showAlert('请填写机器码');
                return false;
            }

            // 验证 HWID 格式 (SAM-XXXX 规则)
            const hwidPattern = /^SAM-[A-Z0-9]{12,}$/i;
            if (!hwidPattern.test(machineCode)) {
                showAlert('机器码格式无效,应为 SAM-XXXXXXXXXXXX 格式');
                return false;
            }

            // PayPal 平台需要验证 PayPal Order ID
            if (platform === 'paypal') {
                const paypalOrderId = paypalOrderIdInput.value.trim();
                if (!paypalOrderId) {
                    showAlert('请填写 PayPal Order ID');
                    return false;
                }
            }

            // 其他平台需要验证 Payment Order ID
            if (platform === 'other') {
                const otherOrderId = otherOrderIdInput.value.trim();
                if (!otherOrderId) {
                    showAlert('请填写 Payment Order ID');
                    return false;
                }
            }

            return true;
        }

        // 表单提交
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!validateInputs()) {
                return;
            }

            // 禁用按钮并显示加载状态
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Generating...';
            resultArea.classList.remove('show');
            alertBox.innerHTML = '';

            try {
                const requestBody = {
                    machine_code: machineCodeInput.value.trim(),
                    platform: platformSelect.value
                };

                // 根据平台添加特定字段
                if (platformSelect.value === 'paypal') {
                    const paypalOrderId = paypalOrderIdInput.value.trim();
                    requestBody.paypal_order_id = paypalOrderId;
                    requestBody.order_id = paypalOrderId;  // PayPal 使用订单号作为 order_id
                } else if (platformSelect.value === 'other') {
                    requestBody.order_id = otherOrderIdInput.value.trim();
                }

                const response = await fetch('/api/activate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}: 请求失败`);
                }

                // 显示激活码
                activationKeyInput.value = data.activation_key;
                resultArea.classList.add('show');
                showAlert('✅ 激活码生成成功！请妥善保存。', 'success');

            } catch (error) {
                showAlert(`❌ ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Generate Activation Key';
            }
        });

        // 复制到剪贴板
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(activationKeyInput.value);
                copyBtn.innerHTML = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.innerHTML = '📋 Copy to Clipboard';
                }, 2000);
            } catch (error) {
                // 降级方案
                activationKeyInput.select();
                document.execCommand('copy');
                copyBtn.innerHTML = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.innerHTML = '📋 Copy to Clipboard';
                }, 2000);
            }
        });
    </script>
</body>
</html>
